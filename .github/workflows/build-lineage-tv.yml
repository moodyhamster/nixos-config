name: Build LineageOS TV Intel HDMI audio ISO

on:
  push:
    branches:
      - lineage-tv-build
    paths:
      - ".github/workflows/build-lineage-tv.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      ISO_NAME: lineage-21.0-20260331-UNOFFICIAL-x86_64_tv-signed.iso
      ISO_SHA256: f3809277682923531d03afdfb1095c166e4d000a9428e907c19de8fc2991dd4f
      ISO_URL: https://downloads.sourceforge.net/project/lineageos-tv-x86/lineage-21.0/x86_64_tv/lineage-21.0-20260331-UNOFFICIAL-x86_64_tv-signed.iso
      GAPPS_NAME: MindTheGapps-14.0.0-x86_64-ATV-full-20250624_164100.zip
      GAPPS_SHA256: f6422807bf9963cb23c52ed933d51af80660de96ae80b68c917005ea7782524b
      GAPPS_URL: https://github.com/supremegamers/MTG-14.0.0-x86_64-ATV/releases/download/MindTheGapps-14.0.0-x86_64-ATV-20250624_164100/MindTheGapps-14.0.0-x86_64-ATV-full-20250624_164100.zip
      PATCH_REPO: https://github.com/BigShoots/Lineage_OS_TV_X86_Intel.git
      PATCH_COMMIT: 365185c005bf6787570349a889e2c81d36406264
      OUT_NAME: lineage-21.0-20260331-UNOFFICIAL-x86_64_tv-audio-output-gapps.iso

    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v4

      - name: Install image tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorriso erofs-utils p7zip-full e2fsprogs util-linux zip unzip curl ca-certificates

      - name: Prepare Android SDK
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n1)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"
          echo "$ANDROID_HOME/build-tools/34.0.0" >> "$GITHUB_PATH"

      - name: Download and verify source ISO
        run: |
          set -euxo pipefail
          curl -fL --retry 8 --retry-delay 5 --connect-timeout 30 \
            "$ISO_URL" -o "$ISO_NAME"
          echo "$ISO_SHA256  $ISO_NAME" | sha256sum -c -

      - name: Download and verify Android TV GApps
        run: |
          set -euxo pipefail
          curl -fL --retry 8 --retry-delay 5 --connect-timeout 30 \
            "$GAPPS_URL" -o "$GAPPS_NAME"
          echo "$GAPPS_SHA256  $GAPPS_NAME" | sha256sum -c -

      - name: Fetch Intel HDMI audio patch set
        run: |
          set -euxo pipefail
          git clone "$PATCH_REPO" patchrepo
          git -C patchrepo checkout "$PATCH_COMMIT"
          test "$(git -C patchrepo rev-parse HEAD)" = "$PATCH_COMMIT"

      - name: Extract system image
        run: |
          set -euxo pipefail
          mkdir -p work/iso-root work/system work/audio-output-switch work/apk/original out
          cp -a patchrepo/audio-output-switch/. work/audio-output-switch/

          xorriso -osirrox on -indev "$ISO_NAME" \
            -extract /system.efs work/iso-root/system.efs

          sudo mkdir -p /mnt/lineage-efs
          sudo mount -o loop,ro -t erofs work/iso-root/system.efs /mnt/lineage-efs
          sudo cp --sparse=always /mnt/lineage-efs/system.img work/system/system.img
          sudo umount /mnt/lineage-efs
          sudo chown "$USER:$USER" work/system/system.img

          file work/system/system.img
          set +e
          sudo e2fsck -fy work/system/system.img
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then
            exit "$rc"
          fi

          # Leave comfortable room for the TV GApps package and patch files.
          truncate -s +1536M work/system/system.img
          sudo resize2fs work/system/system.img

      - name: Extract framework APKs needed to build switcher
        run: |
          set -euxo pipefail
          sudo mkdir -p /mnt/lineage-system
          sudo mount -o loop,ro work/system/system.img /mnt/lineage-system

          framework="$(sudo find /mnt/lineage-system -type f -name framework-res.apk -print -quit)"
          tvsettings="$(sudo find /mnt/lineage-system -type f -name TvSettingsTwoPanel.apk -print -quit)"

          if [ -z "$framework" ] || [ -z "$tvsettings" ]; then
            echo "framework-res.apk: $framework"
            echo "TvSettingsTwoPanel.apk: $tvsettings"
            sudo find /mnt/lineage-system -maxdepth 7 -type f \
              \( -name '*Settings*.apk' -o -name 'framework-res.apk' \) -print | head -100
            exit 1
          fi

          sudo cp "$framework" work/apk/original/framework-res.apk
          sudo cp "$tvsettings" work/apk/original/TvSettingsTwoPanel.apk
          sudo umount /mnt/lineage-system
          sudo chown -R "$USER:$USER" work/apk

      - name: Build audio output switcher
        run: |
          set -euxo pipefail
          sed -i \
            "s#^ANDROID_JAR=.*#ANDROID_JAR=\"$ANDROID_HOME/platforms/android-34/android.jar\"#" \
            work/audio-output-switch/build.sh

          export AAPT2="$ANDROID_HOME/build-tools/34.0.0/aapt2"
          export D8="$ANDROID_HOME/build-tools/34.0.0/d8"
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          bash work/audio-output-switch/build.sh

      - name: Patch LineageOS system image
        run: |
          set -euxo pipefail
          sudo -E bash patchrepo/scripts/install_audio_switcher_to_system_img.sh
          sudo -E bash patchrepo/scripts/install_primary_hdmi_policy_to_system_img.sh
          sudo -E bash patchrepo/scripts/install_usb_storage_visibility_to_system_img.sh
          sudo -E bash patchrepo/scripts/install_fire_remote_keylayout_to_system_img.sh

      - name: Integrate Android TV GApps
        run: |
          set -euxo pipefail
          sudo -E bash patchrepo/scripts/integrate_mindthegapps.sh "$GITHUB_WORKSPACE/$GAPPS_NAME"

          # The repository's current GApps script removes the Settings overlay
          # while normalizing the image. Reinstall the audio switcher afterward
          # so the final image contains both the app and its Settings overlay.
          sudo -E bash patchrepo/scripts/install_audio_switcher_to_system_img.sh

      - name: Package bootable ISO
        run: |
          set -euxo pipefail
          sudo chown "$USER:$USER" work/system/system.img
          bash patchrepo/scripts/package_gapps_iso.sh
          test -f "out/$OUT_NAME"

      - name: Validate final ISO
        run: |
          set -euxo pipefail
          export PATH="$ANDROID_HOME/build-tools/34.0.0:$PATH"
          sudo -E env PATH="$PATH" bash patchrepo/scripts/validate_gapps_iso.sh "out/$OUT_NAME"

      - name: Create checksums and split files
        run: |
          set -euxo pipefail
          mkdir -p artifact
          sha256sum "out/$OUT_NAME" | tee artifact/SHA256SUMS
          stat -c '%n %s bytes' "out/$OUT_NAME" | tee artifact/SIZE.txt

          cat > artifact/BUILD_INFO.txt <<EOF
          Base ISO: $ISO_NAME
          Base ISO SHA-256: $ISO_SHA256
          GApps: $GAPPS_NAME
          GApps SHA-256: $GAPPS_SHA256
          HDMI patch repository: $PATCH_REPO
          HDMI patch commit: $PATCH_COMMIT
          Output: $OUT_NAME
          EOF

          split -b 1900M -d -a 2 "out/$OUT_NAME" "artifact/$OUT_NAME.part-"
          sha256sum artifact/"$OUT_NAME".part-* > artifact/SHA256SUMS.parts

      - name: Upload finished ISO parts
        uses: actions/upload-artifact@v4
        with:
          name: lineage-tv-intel-hdmi-audio-gapps
          path: artifact/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
